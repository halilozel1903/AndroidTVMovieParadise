plugins {
    alias(libs.plugins.android.application)
}

// A shared demo TMDB key is bundled so the app runs straight after cloning. Replace it with
// your own through (in order) a Gradle property, local.properties, or the environment.
// See README > Getting Started.
def defaultTmdbApiKey = '45dfdbd49fa1f1da1f5b75fd60217433'
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def tmdbApiKey = (providers.gradleProperty('TMDB_API_KEY').orNull
        ?: localProperties.getProperty('TMDB_API_KEY')
        ?: providers.environmentVariable('TMDB_API_KEY').orNull
        ?: defaultTmdbApiKey).trim()

android {
    namespace 'com.halil.ozel.movieparadise'
    compileSdk 37

    defaultConfig {
        applicationId 'com.halil.ozel.movieparadise'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.6'

        buildConfigField 'String', 'TMDB_API_KEY', "\"${tmdbApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        warningsAsErrors = false
        abortOnError = true
        checkDependencies = true
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    // AndroidX UI
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.cardview
    implementation libs.androidx.core
    implementation libs.androidx.leanback
    implementation libs.androidx.palette
    implementation libs.androidx.splashscreen

    // Network and JSON
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.retrofit.adapter.rxjava3
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.gson

    // Images
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // Reactive streams
    implementation libs.rxandroid
    implementation libs.rxjava

    // Dependency injection
    implementation libs.dagger
    annotationProcessor libs.dagger.compiler

    // Unit tests
    testImplementation libs.junit
    testImplementation libs.okhttp.mockwebserver
}
